[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetti-power-watch"
version = "0.1.0"
description = "Keeps a Linux PC going through a blackout on a BLUETTI power station"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "svitlovyk" }]
requires-python = ">=3.11"
dependencies = ["bluetti-bt-lib==0.1.8", "bleak"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Power (UPS)",
]

[project.urls]
Homepage = "https://github.com/goldhak/bluetti-power-watch"

[project.scripts]
bluetti-power-watch = "bluetti_power_watch:main"

[tool.setuptools]
py-modules = ["bluetti_power_watch"]
